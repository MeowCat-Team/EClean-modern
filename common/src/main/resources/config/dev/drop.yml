# ============================================
# EClean Dev 配置 - drop
# ============================================
# 警告: 此配置适合高度自由度的技术玩家。
# 包含完整参数，改错可能导致插件行为异常。
# ============================================

enabled: true
# 不参与掉落物清理的世界
disabledWorlds: []
# remove-matching=只清匹配项；keep-matching=保留匹配项（旧 blacklistMode 仍兼容）
mode: keep-matching
# 保护附魔物品
protectEnchanted: false
# 保护带 lore 物品
protectLore: false
# 保护成书
protectWrittenBook: false
# 匹配规则，例如 "DIAMOND.*"
matchers: []
# 距离最近玩家超过该值才清理（米）；null=不限制
maxDistance: null
# 按物品类型单独覆盖
# typeRules:
#   DIAMOND:
#     enabled: false
#     maxDistance: 10
typeRules: {}