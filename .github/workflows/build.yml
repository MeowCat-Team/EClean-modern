name: Build

on:
  pull_request:
    branches: [modern]
  push:
    branches: [modern]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build and test
        run: ./gradlew :common:check :paper:build

      - name: Upload jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EClean-Modern
          path: paper/build/libs/*.jar
          if-no-files-found: error

  fabric:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.1.2", "26.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build and test Fabric
        run: ./gradlew :common:check :fabric:build -PminecraftVersion=${{ matrix.minecraft }}

      - name: Smoke test packaged Fabric mod
        timeout-minutes: 10
        run: python3 .github/scripts/fabric-smoke.py ${{ matrix.minecraft }}

      - name: Upload Fabric smoke logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EClean-Fabric-smoke-${{ matrix.minecraft }}
          path: |
            .local/fabric-smoke/${{ matrix.minecraft }}/smoke-console.log
            .local/fabric-smoke/${{ matrix.minecraft }}/logs/latest.log
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload Fabric mod
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EClean-Modern-Fabric-${{ matrix.minecraft }}
          path: fabric/build/${{ matrix.minecraft }}/libs/EClean-Modern-*-fabric-mc${{ matrix.minecraft }}.jar
          if-no-files-found: error
