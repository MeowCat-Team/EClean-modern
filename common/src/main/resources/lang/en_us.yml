command.config.line: "<white>{line}</white>"
command.config.semantics: |-
  <gray>normal and dev are independent profiles. Switching profiles does not inherit settings from the other profile.</gray>
  <gray>mode overrides the legacy blacklistMode: remove-matching removes matching entities; keep-matching keeps matching entities.</gray>
  <gray>Dense entity protection rules are configured separately. Count limits are applied in configuration order.</gray>
  <gray>Count alerts are evaluated separately for each entity type.</gray>

