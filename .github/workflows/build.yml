name: Build

on:
  pull_request:
    branches: [architectury]
  push:
    branches: [architectury]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      paper-matrix: ${{ steps.compatibility.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Paper compatibility matrix
        id: compatibility
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          data = json.loads(Path("paper/compatibility.json").read_text(encoding="utf-8"))
          versions = data["versions"]
          assert data["java"] == 25 and versions, "Paper compatibility requires Java 25 and version pins"
          for entry in versions:
              assert re.fullmatch(r"\d+(?:\.\d+){1,2}", entry["minecraft"]), "Invalid Minecraft version"
              assert type(entry["build"]) is int and entry["build"] > 0, "Invalid Paper build"
              assert entry["channel"] in {"STABLE", "ALPHA"}, "Unapproved Paper channel"
              assert re.fullmatch(r"[a-f0-9]{64}", entry["sha256"]), "Invalid Paper SHA-256"
          names = [entry["minecraft"] for entry in versions]
          assert len(names) == len(set(names)), "Duplicate Minecraft version"
          assert names == sorted(names, key=lambda value: tuple(map(int, value.split(".")))), "Versions must be ordered"
          assert (names[0], names[-1]) == (data["minimum"], data["maximum"]), "Compatibility bounds differ from version pins"
          descriptor = Path("paper/src/main/resources/plugin.yml").read_text(encoding="utf-8")
          declared = re.search(r"(?m)^api-version:\s*['\"]?([^'\"\s]+)", descriptor)
          assert declared and declared.group(1) == data["minimum"], "Plugin api-version differs from the tested minimum"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": versions}, separators=(",", ":")) + "\n")
          PY

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build and test
        run: ./gradlew :common:check :paper:build

      - name: Upload jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EClean-Modern
          path: paper/build/libs/*.jar
          if-no-files-found: error

  paper-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build.outputs.paper-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download packaged Paper plugin
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: EClean-Modern
          path: paper/build/libs

      - name: Smoke test packaged Paper plugin
        timeout-minutes: 10
        env:
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
          PAPER_BUILD: ${{ matrix.build }}
          PAPER_CHANNEL: ${{ matrix.channel }}
          PAPER_SHA256: ${{ matrix.sha256 }}
        run: |
          set -- "$MINECRAFT_VERSION" --build "$PAPER_BUILD" --expected-sha256 "$PAPER_SHA256"
          if [ "$PAPER_CHANNEL" = ALPHA ]; then
            set -- "$@" --allow-unstable
          fi
          python3 .github/scripts/paper-smoke.py "$@"

      - name: Upload Paper smoke logs and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EClean-Paper-smoke-${{ matrix.minecraft }}
          path: |
            .local/paper-smoke/${{ matrix.minecraft }}/smoke-console.log
            .local/paper-smoke/${{ matrix.minecraft }}/smoke-report.json
            .local/paper-smoke/${{ matrix.minecraft }}/logs/latest.log
          include-hidden-files: true
          if-no-files-found: ignore

  mods:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
        minecraft: ["26.1.2", "26.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build and test server mod
        run: ./gradlew :common:check :mod-common:check :${{ matrix.loader }}:build -PminecraftVersion=${{ matrix.minecraft }}

      - name: Smoke test packaged server mod
        timeout-minutes: 10
        run: python3 .github/scripts/mod-smoke.py ${{ matrix.loader }} ${{ matrix.minecraft }}

      - name: Upload server mod smoke logs and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EClean-${{ matrix.loader }}-smoke-${{ matrix.minecraft }}
          path: |
            .local/${{ matrix.loader }}-smoke/${{ matrix.minecraft }}/smoke-console.log
            .local/${{ matrix.loader }}-smoke/${{ matrix.minecraft }}/smoke-report.json
            .local/${{ matrix.loader }}-smoke/${{ matrix.minecraft }}/logs/latest.log
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload server mod
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EClean-Modern-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: ${{ matrix.loader }}/build/${{ matrix.minecraft }}/libs/EClean-Modern-*-${{ matrix.loader }}-mc${{ matrix.minecraft }}.jar
          if-no-files-found: error
