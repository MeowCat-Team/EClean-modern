# ============================================
# EClean Dev 配置 - chunk-density
# ============================================
# 警告: 此配置适合高度自由度的技术玩家。
# 包含完整参数，改错可能导致插件行为异常。
# ============================================

enabled: true
# 密度保护独立于 living；默认保留宠物和悦灵
protectTamed: true
protectAllay: true
# 不参与密集区块清理的世界
disabledWorlds: []
# 是否允许密度规则清理有名字/被拴绳/被骑乘的生物（不影响告警计数）
settings:
  cleanNamed: false
  cleanLeashed: false
  cleanMounted: false
# 区块内单一实体类型的数量严格超过该值时告警（包含受保护实体）
alertThreshold: 50
# 正则匹配多类实体时共享上限；重叠规则按声明顺序执行。例如:
# entityLimits:
#   "ZOMBIE": 30
entityLimits: {}