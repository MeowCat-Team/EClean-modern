import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.time.LocalDateTime
import java.util.zip.CRC32
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

// Loom's SERVER_ONLY conversion writes current-time ZIP headers even for unobfuscated games.
// Canonicalize only its local output container. Every class/resource byte is retained and the
// resulting complete JAR remains subject to Gradle's pinned SHA-256 verification.
afterEvaluate {
    def gameVersion = providers.gradleProperty('minecraftVersion').getOrElse('26.1.2')
    def generated = new File(gradle.gradleUserHomeDir,
        "caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-server-deobf/${gameVersion}/minecraft-server-deobf-${gameVersion}.jar").toPath()
    if (!Files.isRegularFile(generated)) {
        throw new GradleException("Loom did not produce the expected server compile JAR: ${generated}")
    }
    def canonical = Files.createTempFile(generated.parent, 'eclean-canonical-', '.jar')
    try {
        new ZipFile(generated.toFile()).withCloseable { input ->
            def entries = Collections.list(input.entries()).sort { a, b -> a.name <=> b.name }
            if (entries.collect { it.name }.toSet().size() != entries.size()) {
                throw new GradleException('Duplicate entries in the generated Minecraft compile JAR')
            }
            new ZipOutputStream(Files.newOutputStream(canonical)).withCloseable { output ->
                for (entry in entries) {
                    byte[] content = input.getInputStream(entry).withCloseable { it.readAllBytes() }
                    def crc = new CRC32()
                    crc.update(content)
                    def stable = new ZipEntry(entry.name)
                    // Avoid ZIP's 1980-01-01 sentinel: Java emits timezone-dependent extended
                    // timestamps for that boundary. This ordinary DOS date needs no extra fields.
                    stable.setTimeLocal(LocalDateTime.of(2000, 1, 1, 0, 0))
                    stable.setMethod(ZipEntry.STORED)
                    stable.setSize(content.length)
                    stable.setCompressedSize(content.length)
                    stable.setCrc(crc.value)
                    output.putNextEntry(stable)
                    output.write(content)
                    output.closeEntry()
                }
            }
        }
        // Verify the complete entry set and every uncompressed byte before replacing the cache.
        new ZipFile(generated.toFile()).withCloseable { source ->
            new ZipFile(canonical.toFile()).withCloseable { result ->
                if (Collections.list(source.entries()).collect { it.name }.toSet() !=
                    Collections.list(result.entries()).collect { it.name }.toSet()) {
                    throw new GradleException('Minecraft ZIP normalization changed the entry set')
                }
                for (entry in Collections.list(source.entries())) {
                    byte[] before = source.getInputStream(entry).withCloseable { it.readAllBytes() }
                    byte[] after = result.getInputStream(result.getEntry(entry.name)).withCloseable { it.readAllBytes() }
                    if (!Arrays.equals(before, after)) {
                        throw new GradleException("Minecraft ZIP normalization changed ${entry.name}")
                    }
                }
            }
        }
        // Keep an already canonical cache file intact so incremental compilation remains up to date.
        if (Files.mismatch(generated, canonical) != -1L) {
            Files.move(canonical, generated, StandardCopyOption.REPLACE_EXISTING)
        }
    } finally {
        Files.deleteIfExists(canonical)
    }
}
