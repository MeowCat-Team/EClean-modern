debug.console_enable: |-
  <white>Debug messages are temporarily <green>enabled</green>. A server restart restores the configured setting. Run this command again to <red>disable</red> them.</white>
  <gray>To keep them enabled, set global.debug to true in the active configuration profile.</gray>
debug.console_disable: |-
  <white>Debug messages are temporarily <red>disabled</red>. A server restart restores the configured setting. Run this command again to <green>enable</green> them.</white>
  <gray>To keep them disabled, set global.debug to false in the active configuration profile.</gray>
debug.player_enable: <white>Debug messages are <green>enabled</green>. Run this command again to <red>disable</red> them.</white>
debug.player_disable: <white>Debug messages are <red>disabled</red>. Run this command again to <green>enable</green> them.</white>

cleanup.countdown.60: "<gray>Cleanup starts in <gold>1 minute</gold>.</gray>"
cleanup.countdown.30: "<gray>Cleanup starts in <gold>30 seconds</gold>.</gray>"
cleanup.countdown.10: "<gray>Cleanup starts in <gold>10 seconds</gold>.</gray>"
cleanup.countdown.0: "<yellow>Cleaning up...</yellow>"
cleanup.finish.drop: '<white>Counted <gold>{total}</gold> dropped item entities; removed <gold>{cleaned}</gold>.</white>'
cleanup.finish.living: '<white>Counted <gold>{total}</gold> living entities; removed <gold>{cleaned}</gold>.</white>'
cleanup.finish.chunk: '<white>Removed <gold>{cleaned}</gold> dense entities.</white>'
cleanup.finish.world: '<white>Cleanup complete in {world}: removed {drop} dropped item entities, {living} living entities, and {dense} dense entities.</white>'
cleanup.alert.entity: '<red>High entity count: </red><white>{type} in world {world} has reached {count}.</white>'
cleanup.alert.dense: '<red>Dense chunk detected: </red><white>{entity} in chunk {chunk} has reached {count}.</white>'
cleanup.scope.worlds: "{count} worlds"
cleanup.summary.done: |-
  <green>Cleanup complete</green> <dark_gray>·</dark_gray> <aqua>{scope}</aqua>
    <gray>Removed: dropped item entities <gold>{drop}</gold> <dark_gray>·</dark_gray> Living entities <gold>{living}</gold> <dark_gray>·</dark_gray> Dense entities <gold>{dense}</gold></gray>
cleanup.summary.preview: |-
  <aqua>Cleanup preview</aqua> <dark_gray>·</dark_gray> <aqua>{scope}</aqua>
    <gray>Would remove: dropped item entities <gold>{drop}</gold> <dark_gray>·</dark_gray> Living entities <gold>{living}</gold> <dark_gray>·</dark_gray> Dense entities <gold>{dense}</gold></gray>
    <gray>This was a preview. No entities were removed.</gray>
cleanup.summary.partial: |-
    <yellow>This operation did not fully complete: <red>{failed}</red> failures; <gold>{skipped}</gold> chunk scans skipped.</yellow>
    <gray>Run <yellow>/eclean history</yellow> for details.</gray>

