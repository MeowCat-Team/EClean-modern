# ============================================
# EClean Dev 配置 - living
# ============================================
# 警告: 此配置适合高度自由度的技术玩家。
# 包含完整参数，改错可能导致插件行为异常。
# ============================================

enabled: true
# 不参与生物清理的世界
disabledWorlds: []
# 是否清理有名字/被拴绳/被骑乘的生物
settings:
  cleanNamed: false
  cleanLeashed: false
  cleanMounted: false
# remove-matching=只清匹配项；keep-matching=保留匹配项
mode: remove-matching
# 匹配规则，例如 "ZOMBIE"
matchers: []
# 距离最近玩家超过该值才清理（米）；null=不限制
maxDistance: null
# 按实体类型单独覆盖
# typeRules:
#   ZOMBIE:
#     enabled: false
#     maxDistance: 10
typeRules: {}
# 保护已驯服生物
protectTamed: true
# 保护悦灵
protectAllay: true