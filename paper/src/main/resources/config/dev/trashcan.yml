# ============================================
# EClean Dev 配置 - trashcan
# ============================================
# 警告: 此配置适合高度自由度的技术玩家。
# 包含完整参数，改错可能导致插件行为异常。
# ============================================

enabled: true
# 掉落物清理时自动收集进垃圾桶
collectFromDropCleanup: true
# 条目存活秒数；null 表示本次运行内不按时间过期。重启丢失，合并不延长到期时间
clearIntervalSeconds: 600
# 相同物品自动堆叠
stacking:
  enabled: true
  sortByCount: true
  showRemainingTimeInLore: true
# 回收因自然消失而掉落的物品
despawnRecovery:
  enabled: false
  disabledWorlds: []
  matchers: []