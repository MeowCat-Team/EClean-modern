name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      game-version: ${{ steps.version.outputs.game-version }}
      game-versions: ${{ steps.version.outputs.game-versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: modern
          fetch-depth: 0

      - name: Read project version
        id: version
        run: |
          V=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts)
          if [ -z "$V" ]; then
            echo "::error::无法从 build.gradle.kts 读取 version"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          data = json.loads(Path("paper/compatibility.json").read_text(encoding="utf-8"))
          versions = data["versions"]
          assert data["java"] == 25 and versions, "Paper compatibility requires Java 25 and version pins"
          for entry in versions:
              assert re.fullmatch(r"\d+(?:\.\d+){1,2}", entry["minecraft"]), "Invalid Minecraft version"
              assert type(entry["build"]) is int and entry["build"] > 0, "Invalid Paper build"
              assert entry["channel"] in {"STABLE", "ALPHA"}, "Unapproved Paper channel"
              assert re.fullmatch(r"[a-f0-9]{64}", entry["sha256"]), "Invalid Paper SHA-256"
          names = [entry["minecraft"] for entry in versions]
          assert len(names) == len(set(names)), "Duplicate Minecraft version"
          assert names == sorted(names, key=lambda value: tuple(map(int, value.split(".")))), "Versions must be ordered"
          assert (names[0], names[-1]) == (data["minimum"], data["maximum"]), "Compatibility bounds differ from version pins"
          descriptor = Path("paper/src/main/resources/plugin.yml").read_text(encoding="utf-8")
          declared = re.search(r"(?m)^api-version:\s*['\"]?([^'\"\s]+)", descriptor)
          assert declared and declared.group(1) == data["minimum"], "Plugin api-version differs from the tested minimum"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"game-version={data['minimum']}-{data['maximum']}\n")
              output.write("game-versions<<PAPER_GAME_VERSIONS\n" + "\n".join(names) + "\nPAPER_GAME_VERSIONS\n")
          PY
          echo "本次发版版本: $V"

      - name: Check Modrinth credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::请先在仓库 Actions secrets 中配置 MODRINTH_TOKEN"
            exit 1
          fi

      - name: Check tag does not exist
        run: |
          V="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then
            echo "::error::tag v$V 已存在, 请先更新 build.gradle.kts 中的版本号"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build and test
        run: ./gradlew build

      - name: Build and test Fabric 26.2
        run: ./gradlew :fabric:build -PminecraftVersion=26.2

      - name: Test packaged Paper plugin on every supported version
        timeout-minutes: 30
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          data = json.loads(Path("paper/compatibility.json").read_text(encoding="utf-8"))
          failures = []
          for entry in data["versions"]:
              command = [sys.executable, ".github/scripts/paper-smoke.py", entry["minecraft"],
                         "--build", str(entry["build"]), "--expected-sha256", entry["sha256"]]
              if entry["channel"] == "ALPHA":
                  command.append("--allow-unstable")
              print(f"::group::Paper {entry['minecraft']} build {entry['build']} ({entry['channel']})", flush=True)
              result = subprocess.run(command)
              print("::endgroup::", flush=True)
              if result.returncode:
                  failures.append(entry["minecraft"])
          if failures:
              raise SystemExit("Paper smoke failed: " + ", ".join(failures))
          PY

      - name: Upload Paper server test logs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Paper-release-server-logs
          path: |
            .local/paper-smoke/*/smoke-console.log
            .local/paper-smoke/*/smoke-report.json
            .local/paper-smoke/*/logs/latest.log
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Test packaged Fabric 26.1.2 server
        timeout-minutes: 10
        run: python3 .github/scripts/fabric-smoke.py 26.1.2

      - name: Test packaged Fabric 26.2 server
        timeout-minutes: 10
        run: python3 .github/scripts/fabric-smoke.py 26.2

      - name: Upload Fabric server test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Fabric-release-server-logs
          path: |
            .local/fabric-smoke/*/smoke-console.log
            .local/fabric-smoke/*/logs/latest.log
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Extract release notes from changelog
        run: |
          V="${{ steps.version.outputs.version }}"
          awk -v v="$V" '$0 == "## " v { f = 1; next } /^## /{ f = 0 } f' docs/Changelog.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::docs/Changelog.md 中没有找到版本 $V 的段落, 请先更新 changelog"
            exit 1
          fi
          echo "--- release notes ---"
          cat release_notes.md

      - name: Create and push tag
        run: |
          V="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Release v$V"
          git push origin "v$V"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            paper/build/libs/EClean-Modern-*-paper.jar
            fabric/build/26.1.2/libs/EClean-Modern-*-fabric-mc26.1.2.jar
            fabric/build/26.2/libs/EClean-Modern-*-fabric-mc26.2.jar
          fail_on_unmatched_files: true

  publish-modrinth:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern 'EClean-Modern-*-paper.jar' --dir release
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --json body --jq .body > release_notes.md

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: VW7EmMIj # ecl-modern
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release/EClean-Modern-*-paper.jar
          modrinth-name: ${{ needs.release.outputs.version }} (Paper / Folia, MC ${{ needs.release.outputs.game-version }})
          modrinth-version: ${{ needs.release.outputs.version }}+paper.${{ needs.release.outputs.game-version }}
          version-type: release
          changelog-file: release_notes.md
          loaders: |
            paper
            folia
          environment: server
          game-versions: ${{ needs.release.outputs.game-versions }}
          java: '25'

  publish-modrinth-fabric:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2']
    steps:
      - name: Download Fabric release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: |
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "EClean-Modern-*-fabric-mc$MINECRAFT_VERSION.jar" --dir release
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --json body --jq .body > release_notes.md

      - name: Publish Fabric to Modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: VW7EmMIj # ecl-modern
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release/EClean-Modern-*-fabric-mc${{ matrix.minecraft }}.jar
          modrinth-name: ${{ needs.release.outputs.version }} (Fabric, MC ${{ matrix.minecraft }})
          modrinth-version: ${{ needs.release.outputs.version }}+fabric.${{ matrix.minecraft }}
          version-type: release
          changelog-file: release_notes.md
          loaders: fabric
          environment: server
          game-versions: ${{ matrix.minecraft }}
          modrinth-dependencies: fabric-api(required)
          java: '25'
