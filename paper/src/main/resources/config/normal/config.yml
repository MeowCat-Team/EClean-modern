# ============================================
# EClean Normal 配置
# ============================================
# 此配置适合大多数服务器，只提供常用基础项。
# 可添加 advanced 节点覆盖高级项；未填写时使用内置默认值。
# normal 与 dev 支持相同字段；dev 按领域拆分，两个 profile 互不继承。
#
# 修改后使用 /eclean reload；也可以切换预设：
#   /eclean config profile dev
# ============================================

# 全局设置
global:
  # 语言: zh_cn / en_us
  language: zh_cn
  # 调试模式
  debug: false
  # 更新检查在 advanced.update.enabled 配置

# 清理设置
cleanup:
  # 自动清理间隔（秒）
  intervalSeconds: 600
  # Quartz Cron，例如每天 3:00: "0 0 3 * * ?"；null 或空字符串使用 intervalSeconds
  # 启用 Cron 时不能同时设置 perWorld 中的 intervalSeconds
  cron: null
  # 没有玩家在线时也照常清理
  cleanWhenNoPlayers: true
  # 没有玩家在线时也广播清理公告
  broadcastWhenNoPlayers: true

# 掉落物清理
drop:
  enabled: true
  # remove-matching=只清匹配项；keep-matching=保留匹配项（旧 blacklistMode 仍兼容）
  mode: keep-matching
  # 保护附魔物品 / 带 lore 物品 / 成书
  protectEnchanted: false
  protectLore: false
  protectWrittenBook: false
  # 匹配规则，例如 "DIAMOND.*"
  matchers: []
  # 不参与掉落物清理的世界
  disabledWorlds: []

# 生物清理
living:
  enabled: true
  # remove-matching=只清匹配项；keep-matching=保留匹配项
  mode: remove-matching
  # 保护已驯服生物 / 悦灵
  protectTamed: true
  protectAllay: true
  # 是否清理有名字/被拴绳/被骑乘的生物
  settings:
    cleanNamed: false
    cleanLeashed: false
    cleanMounted: false
  # 匹配规则，例如 "ZOMBIE"
  matchers: []
  # 不参与生物清理的世界
  disabledWorlds: []

# 密集区块清理
chunkDensity:
  enabled: true
  # 独立于 living 的密度保护；默认保留宠物和悦灵
  protectTamed: true
  protectAllay: true
  # 区块内单一实体类型的数量严格超过该值时告警（包含受保护实体）
  alertThreshold: 50
  # 正则匹配多类实体时共享上限；重叠规则按声明顺序执行。例如:
  # entityLimits:
  #   "ZOMBIE": 30
  entityLimits: {}
  # 不参与密集区块清理的世界
  disabledWorlds: []

# 垃圾桶
trashcan:
  enabled: true
  # 条目存活秒数；null 表示本次运行内不按时间过期。重启丢失，合并不延长到期时间
  clearIntervalSeconds: 600
  # 相同物品自动堆叠为一个条目
  stacking:
    enabled: true
    sortByCount: true
    showRemainingTimeInLore: true

# 单独世界覆盖（留空使用全局设置）
perWorld:
  worlds: {}

# 可选高级设置；normal 与 dev 不继承彼此，切换前请 validate / diff
advanced:
  update:
    enabled: true
