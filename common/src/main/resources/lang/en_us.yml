command.usage.debug: <green>/eclean debug</green> <white>Enable or disable debug messages</white>
command.usage.reload: <green>/eclean reload</green> <white>Reload configuration and language files</white>
command.usage.trash: |-
  <green>/eclean trash [open]</green> <white>Open the shared trash can</white>
  <green>/eclean trash stats</green> <white>View item quantities and time remaining</white>
command.usage.players: <green>/eclean players</green> <white>View online players and their locations</white>
command.usage.show: <green>/eclean show</green> <white>Open the dense entity detection menu</white>
command.usage.stats: |-
  <green>/eclean stats [world]</green> <white>View entity and chunk statistics for the current or specified world</white>
  <green>/eclean stats gui [world]</green> <white>Open the statistics menu; viewing another world requires stats.world permission</white>
command.usage.entity: |-
  <green>/eclean entity [type] [world] [min-count]</green> <white>View entity counts by chunk, showing only chunks above min-count (default 0)</white>
  <green>/eclean entity [type] [world] [chunk-x] [chunk-z]</green> <white>View entity coordinates in the specified chunk</white>
command.usage.clean: |-
  <green>/eclean clean [all|entity|drop|chunk] [world] [--preview]</green> <white>Run cleanup now; add --preview to preview without removing entities</white>
  <gray>--preview can appear anywhere after clean.</gray>
  <green>/eclean clean trash [--preview]</green> <white>Clear the shared trash can; add --preview to view the item count without clearing it</white>
command.usage.status: |-
  <green>/eclean status all</green> <white>View server-wide statistics</white>
  <green>/eclean status <world></green> <white>View statistics for the specified world</white>
command.usage.history: <green>/eclean history [amount]</green> <white>View recent cleanup history</white>
command.usage.top: |-
  <green>/eclean top entity|chunk [amount] [world]</green> <white>Rank entities or chunks by count. Shows the server-wide top 10 by default.</white>
  <gray>Amount must be 1–100. Specify an amount before a world, e.g. /eclean top entity 10 world.</gray>
command.usage.teleport: '<green>/eclean tp <world> <x> <y> <z></green> <white>Teleport to coordinates in the specified world</white>'
command.usage.config: |-
  <green>/eclean config show</green> <white>View the active configuration profile and file paths</white>
  <green>/eclean config validate</green> <white>Check configuration and language files for errors</white>
  <green>/eclean config diff</green> <white>View file changes that have not yet been applied</white>
  <green>/eclean config effective [world]</green> <white>View the active rules and their sources</white>
  <green>/eclean config profile normal|dev</green> <white>Switch configuration profiles and reload immediately</white>

command.config.show: <gold>EClean Configuration Profile</gold>
