# ============================================
# EClean 配置预设
# ============================================
# normal: 简洁基础配置（默认，适合大多数服务器）
# dev:    完整高级配置，适合高度自由度的技术玩家
#
# 修改后重启生效；也可以使用命令：
#   /eclean config show
#   /eclean config profile <normal|dev>
# ============================================
profile: normal