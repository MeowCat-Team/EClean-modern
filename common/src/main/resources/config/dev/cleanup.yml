# ============================================
# EClean Dev 配置 - cleanup
# ============================================
# 警告: 此配置适合高度自由度的技术玩家。
# 包含完整参数，改错可能导致插件行为异常。
# ============================================

# 自动清理间隔（秒）；cron 为空时生效
intervalSeconds: 600
# Quartz Cron，例如每天 3:00: "0 0 3 * * ?"；null 或空字符串使用 intervalSeconds
# 启用 Cron 时不能同时设置 per-world.yml 中的 intervalSeconds
cron: null
# 没有玩家在线时也照常清理
cleanWhenNoPlayers: true
# 没有玩家在线时也广播清理公告
broadcastWhenNoPlayers: true

# 实体数量异常提醒（提醒文案在 lang 文件的 cleanup.alert.entity）
alertEnabled: false
alertEntityThreshold: 500
alertCheckIntervalSeconds: 600
